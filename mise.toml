[tools]
go = "1.27"
goreleaser = "2.19.0"

[tasks.build]
description = "Build the server into bin/fastmail-mcp"
run = "go build -o bin/fastmail-mcp ./cmd/fastmail-mcp"

[tasks.test]
description = "Run the test suite (no network)"
run = "go test ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -l -w ."

[tasks.check]
description = "Format check, vet and test"
depends = ["vet", "test"]
run = "test -z \"$(gofmt -l .)\" || { echo 'unformatted files:'; gofmt -l .; exit 1; }"

[tasks.run]
description = "Run the server over stdio, needs FASTMAIL_TOKEN"
run = "go run ./cmd/fastmail-mcp"

[tasks."release:check"]
description = "Validate the goreleaser config"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Build binaries and images locally without publishing"
run = "goreleaser release --snapshot --clean"
