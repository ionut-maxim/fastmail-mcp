# release-please keeps a release PR open from the Conventional Commits on
# main. Merging it tags vX.Y.Z and publishes the GitHub release with the
# changelog. goreleaser then attaches the binaries to that release (leaving
# its notes alone) and pushes ghcr.io/ionut-maxim/fastmail-mcp:X.Y.Z and
# :latest for linux/amd64 and linux/arm64.
name: release

on:
  push:
    branches: [main]

# The repository's default GITHUB_TOKEN is read-only; each job asks for what
# it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.4
        with:
          install_args: go goreleaser
      - name: Vet and test
        run: go vet ./... && go test -race ./...
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Release binaries and image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean
      - name: Summary
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "Pushed \`ghcr.io/ionut-maxim/fastmail-mcp:${TAG#v}\` and attached binaries to $TAG" >> "$GITHUB_STEP_SUMMARY"
