# Format check, vet, race tests and a goreleaser config check on every PR
# and push to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
        env:
          MISE_LOCKED: "1" # install only what mise.lock records, checksums included
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.8 # reads mise.lock's format (older mise can't)
          install_args: go goreleaser
      - name: Format, vet and test
        run: |
          test -z "$(gofmt -l .)" || { echo 'unformatted files:'; gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...
      - name: Check goreleaser config
        run: goreleaser check
